name: Compilar APK de Android

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3

    - name: Generar ejecutable Gradle Wrapper si no existe
      run: |
        gradle wrapper --gradle-version 8.1.1
        chmod +x gradlew

    - name: Compilar APK (Debug)
      run: ./gradlew assembleDebug --stacktrace

    - name: Buscar y subir APK generado
      uses: actions/upload-artifact@v4
      with:
        name: Trasmitir-App-Debug
        path: app/build/outputs/apk/debug/*.apk
