name: Compilar APK de Android

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Dar permisos a Gradle
      run: chmod +x gradlew || true

    - name: Compilar APK con Gradle
      run: gradle assembleDebug

    - name: Subir APK como artefacto descargable
      uses: actions/upload-artifact@v4
      with:
        name: Trasmitir-App-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
